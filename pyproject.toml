[project]
name = "agentkit"
version = "0.1.0"
description = "A reusable foundation for building AI agent projects."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
keywords = ["ai", "agents", "llm", "tool-use", "evals", "mcp", "observability"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "httpx>=0.28.1",
    "jsonschema>=4.26.0",
    "opentelemetry-api>=1.30",
    "pydantic>=2.7,<3",
    "pyyaml>=6",
    "typer>=0.12",
]

[project.scripts]
agentkit = "agentkit.cli.main:app"

[project.optional-dependencies]
anthropic = [
    "anthropic>=1",
]
adk = [
    "google-adk>=1.28.1",
    "litellm>=1.104.0",
]
mcp = [
    "mcp>=1.10",
]

[dependency-groups]
dev = [
    "anthropic>=1",
    "google-adk>=1.28.1",
    "litellm>=1.104.0",
    "mcp>=1.10",
    "mypy>=1.11",
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5",
    "ruff>=0.6",
    "types-jsonschema>=4.26.0.20261006",
    "types-PyYAML>=6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agentkit"]

# The shipped defaults live in the top-level config/ directory (spec section 6);
# the wheel carries them inside the package so load_config can find them.
[tool.hatch.build.targets.wheel.force-include]
"config" = "agentkit/_shipped_config"
"templates" = "agentkit/_templates"

[tool.ruff]
line-length = 100
target-version = "py311"
# ruff formats Python code blocks inside Markdown; the spec's snippets are not ours to restyle.
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
strict = true
files = ["src/agentkit"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["google.adk.*", "litellm.*"]
follow_untyped_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
# Deprecation notices raised inside Google's libraries when the ADK adapter is imported.
filterwarnings = ["ignore::DeprecationWarning:google.*", "ignore::DeprecationWarning:litellm.*"]
markers = [
    "integration: calls a real hosted provider; skipped when keys are absent",
    "local_model: needs a reachable local model server",
]
