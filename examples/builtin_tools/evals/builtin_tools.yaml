# At least one case per builtin tool. Model replies are scripted; file and web
# tools answer from fixtures/workspace.yaml.

suite: builtin_tools
agent: toolbox
defaults:
  graders: [no_error]

cases:
  - id: calculator
    input: "What is 1717 times 2323?"
    setup:
      fake_model:
        - tool_call: { name: calculator, arguments: { expression: "1717 * 2323" } }
        - text: "It is 3988591."
    expect:
      tool_calls: { must_include: [calculator] }
      output: { contains: ["3988591"] }
    tags: [smoke]

  - id: current_time
    input: "What day is it in Berlin?"
    setup:
      fake_model:
        - tool_call: { name: current_time, arguments: { timezone: Europe/Berlin } }
        - text: "I checked the clock."
    expect:
      tool_calls:
        must_include:
          - { name: current_time, arguments: { timezone: Europe/Berlin } }
    tags: [smoke]

  - id: list_files_then_read_file
    input: "What do my notes say?"
    setup:
      fixtures: [workspace]
      fake_model:
        - tool_call: { name: list_files }
        - tool_call: { name: read_file, arguments: { path: notes.txt } }
        - text: "Your notes say the launch is on Friday."
    expect:
      tool_calls: { in_order: [list_files, read_file] }
      output: { contains: ["Friday"] }
    tags: [smoke]

  - id: read_file_missing
    input: "Read todo.txt."
    setup:
      fixtures: [workspace]
      fake_model:
        - tool_call: { name: read_file, arguments: { path: todo.txt } }
        - text: "There is no todo.txt in the workspace."
    expect:
      output: { contains: ["no todo.txt"] }
    tags: [smoke]

  - id: http_fetch
    input: "What is the title of https://example.com/?"
    setup:
      fixtures: [workspace]
      fake_model:
        - tool_call: { name: http_fetch, arguments: { url: "https://example.com/" } }
        - text: "The page is titled Example Domain."
    expect:
      tool_calls: { must_include: [http_fetch] }
      output: { contains: ["Example Domain"] }
    tags: [smoke]

  - id: http_fetch_without_fixture_is_not_live
    input: "Fetch https://example.com/other."
    setup:
      fake_model:
        - tool_call: { name: http_fetch, arguments: { url: "https://example.com/other" } }
        - text: "I could not fetch that page."
    expect:
      output: { contains: ["could not fetch"] }
    tags: [smoke]
