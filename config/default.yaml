# Shipped defaults. Every key here can be overridden by a project's agentkit.yaml,
# agentkit.<env>.yaml, AGENTKIT_* environment variables, or arguments in code.
# The `models` section is loaded from models.yaml.

env: dev

limits:
  max_steps: 25                 # model turns per run
  max_tool_calls: 50
  max_input_tokens: 500000
  max_output_tokens: 50000
  max_cost_usd: 2.00
  max_wall_seconds: 300

retry:
  max_attempts: 3
  base_delay_seconds: 1.0
  max_delay_seconds: 30.0

timeouts:
  model_call_seconds: 120
  tool_call_seconds: 60

tools:
  enabled: [http_fetch, read_file, calculator]
  max_tools_per_agent: 20       # selecting more than this for one agent warns
  max_output_chars: 20000       # longer tool output is truncated, with a marker
  approval:
    default: require            # require | allow | deny
    by_side_effects:            # classes not listed here use `default`
      none: allow
      read_external: allow
    overrides:                  # per tool name; the only way to allow a destructive tool
      remember: allow           # writes only to the session's own notes
  settings:
    http_fetch:
      allowed_domains: []       # nothing is fetchable until listed, e.g. ["*.example.com"]; "*" allows all
    filesystem:
      root: ./workspace
    web_search:
      backend: searxng
      base_url: null            # address of your SearXNG instance, e.g. http://127.0.0.1:8080
    sql_query:
      database: null            # path of a SQLite file; it is opened read-only

  # Tools from Model Context Protocol servers (needs the `mcp` extra). Each tool is
  # registered as <server>_<tool> and is treated as `write` unless declared here:
  # mcp_servers:
  #   docs:
  #     command: ["python", "servers/docs.py"]   # or url: https://mcp.example.com/mcp
  #     side_effects: { search: read_external }
  #     keep_alive: true        # one connection for the life of the process (default)

guardrails:
  approval_channel: cli         # cli | callback | auto_deny | auto_approve (tests only)
  redact_patterns: [email, api_key]   # email | api_key; always applied to traces and logs
  redact_at: [tool_output, final_answer]  # also hide them from the model here; any of
                                          # user_input, tool_output, final_answer, or []
  max_identical_tool_calls: 3   # the same tool call more often than this stalls the run
  max_empty_steps: 2            # consecutive steps with neither a tool call nor an answer

observability:
  exporter: jsonl               # jsonl | otlp | console | none
  jsonl_path: ./.agentkit/traces
  log_level: INFO
  capture_content: true         # false stores metadata only

evals:
  dataset_dir: ./evals
  results_dir: ./.agentkit/evals
  cassette_dir: ./evals/cassettes
  concurrency: 4
  judge_role: judge
  judge_min_score: 0.7          # an llm_judge score below this fails the case
  fail_under: 100               # `eval run` exits non-zero below this pass rate (percent)
  max_pass_rate_drop: 2         # `eval compare` exits non-zero beyond this drop (points)

memory:
  store: sqlite                 # sqlite | memory; where chat sessions and notes are kept
  sqlite_path: ./.agentkit/memory.db
  context:
    strategy: drop_tool_results # off | drop_tool_results | summarize (uses the `fast` role)
    trigger_ratio: 0.8          # act when history reaches this share of the model's context window
    keep_recent_messages: 6     # the newest messages are never trimmed

runtime:
  adapter: native               # native | adk | langgraph | claude_sdk
